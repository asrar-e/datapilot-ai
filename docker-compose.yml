services:
  db:
    image: postgres:16-alpine
    container_name: datapilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: datapilot_ai
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot_local_only
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: datapilot-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://datapilot:datapilot_local_only@db:5432/datapilot_ai
      APP_NAME: DataPilot AI
      APP_ENV: docker
      GROQ_MODEL: openai/gpt-oss-20b
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: datapilot-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
